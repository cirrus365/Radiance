# Example site for the radiance Hugo theme.
# Build with: hugo --source exampleSite --themesDir ../..

baseURL = "http://localhost:1313/"
title = "radiance"
# The language key doubles as the document language (lang="en-gb").
defaultContentLanguage = "en-gb"
theme = "radiance"

[params]
  description = "A Hugo theme that makes a content website feel like an Ubuntu desktop running GNOME 2."

# Primary navigation for the top panel (layouts/partials/panel-top.html).
# A search link is rendered by the theme itself when a "search" page
# exists.

[[menus.main]]
  name = "Posts"
  pageRef = "/posts"
  weight = 10

[[menus.main]]
  name = "Moodboards"
  pageRef = "/moodboards"
  weight = 20

[[menus.main]]
  name = "Archive"
  pageRef = "/archive"
  weight = 30

[[menus.main]]
  name = "Tags"
  pageRef = "/tags"
  weight = 40

[[menus.main]]
  name = "Docs"
  pageRef = "/docs"
  weight = 40

[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 50

[[menus.main]]
  name = "RSS"
  pageRef = "/"
  weight = 60
  [menus.main.params]
    feed = true

# Search index: a custom output format on the home page renders index.json.
[outputFormats]
  [outputFormats.search]
    mediaType = "application/json"

[outputs]
  home = ["HTML", "RSS", "search"]
