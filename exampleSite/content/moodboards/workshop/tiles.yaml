# Tile data for the Workshop sounds moodboard.
#
# This file is a list of tiles; see the tile schema table in the theme
# README for every field. The audio file is synthesised for this example
# site; see "Example assets" in the README for its origin.

- type: image
  span: 2x2
  src: images/harbour.png
  alt: "A dark harbour at dusk with a low orange band of light on the horizon."
  title: "Harbour, last light"
- type: audio
  span: 1x1
  src: audio/ambience.wav
  title: "Bench ambience"
- type: quote
  span: 2x1
  text: "A workshop sounds best when the tools stay quiet and the thinking is loud."
  attribution: "Bench diary"
- type: note
  span: 1x1
  body: "Recorded on a still evening; play quietly and keep working."
