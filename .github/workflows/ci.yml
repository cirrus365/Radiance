# CI guardrails for the radiance theme.
#
# Runs the checks in scripts/checks.sh on push and pull request. Each
# check fails deliberately when its condition is introduced:
#
# - hex colour literals in layouts/ or assets/css/
# - a contrast failure from scripts/contrast.py
# - a Hugo build warning, via --panicOnWarning on the example site
#   (this also covers a scheme file whose key set differs from the
#   others: partials/schemes-css.html warns on divergence)
# - a site param read directly in a template instead of through
#   partials/config/get.html against data/schema.yaml
#
# The checkout directory must be named "radiance": the example site
# resolves the theme through themesDir by that name, and Linux is
# case-sensitive.

name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: radiance

      - name: Install Hugo Extended (minimum supported version)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.128.0"
          extended: true

      - name: Guardrail checks
        run: sh scripts/checks.sh
        working-directory: radiance
