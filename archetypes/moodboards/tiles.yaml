# Tile data for this moodboard: a list of tiles.
#
# The layout reads this file (the `tiles` front matter field may point at
# a different filename). The theme's data/tiles.yaml lists every tile
# type, its partial and its required fields. Reference resources inside
# this bundle, e.g. images/placeholder.png.

- type: image
  span: 2x2
  src: images/placeholder.png
  alt: "A quiet warm-grey placeholder image generated for new boards."
  title: "Placeholder"
- type: note
  span: 1x1
  title: "Replace me"
  body: "Describe the board: what it gathers and why."
